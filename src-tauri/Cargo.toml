[package]
name = "amber-music"
version = "1.0.0"
description = "Amber Music Platform - a modern music platform with YouTube Music integration"
authors = ["Pant0x"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "amber_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
# Optimize for size and performance
opt-level = "z"  # Optimize for size
lto = true       # Link-time optimization
codegen-units = 1
panic = "abort"
strip = true     # Strip symbols

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png", "updater"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-localhost = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-shell = "2"
portpicker = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "stream", "json"] }
base64 = "0.22"
url = "2.5"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }
discord-rich-presence = "0.2"
md5 = "0.8.0"
lofty = "0.24.0"
notify = "8.2.0"
futures-util = "0.3.33"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "fs"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-all"] }
symphonia = { version = "0.5", default-features = false, features = ["mkv", "ogg", "mp3", "aac", "flac"] }
opus = "0.3.1"

# Performance: use faster allocator
# jemallocator = { version = "0.5", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
aes-gcm = "0.10"
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSDictionary", "NSGeometry", "NSObject", "NSString", "NSValue", "objc2-core-foundation"] }
rand = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = [
  "Foundation",
  "Media",
  "Media_Playback",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
souvlaki = "0.7"
dbus = "0.10"

# Optional: jemalloc for better memory management
# [features]
# jemalloc = ["jemallocator"]